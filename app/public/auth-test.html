<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubHub Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SubHub Authentication Test</h1>
        <p>This page tests the Supabase authentication flow to diagnose endless loading issues.</p>
        
        <div class="test-section">
            <h3>Authentication Status</h3>
            <div id="auth-status" class="status info">Checking authentication...</div>
            <div id="session-info" class="status info">Session: Checking...</div>
            <div id="user-info" class="status info">User: Checking...</div>
        </div>

        <div class="test-section">
            <h3>Test Actions</h3>
            <button class="btn-primary" onclick="testLogin()">Test Login</button>
            <button class="btn-danger" onclick="testLogout()">Test Logout</button>
            <button class="btn-primary" onclick="checkSession()">Check Session</button>
            <button class="btn-primary" onclick="clearLogs()">Clear Logs</button>
        </div>

        <div class="test-section">
            <h3>Test Logs</h3>
            <div id="logs" class="log">Initializing...</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js@2';

        const supabaseUrl = 'https://kfzuzxsywaptgbumrfgv.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmenV6eHN5d2FwdGdidW1yZmd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5NTgwNTYsImV4cCI6MjA2NjUzNDA1Nn0.zXged0s_9x_K7i1EA8N8MaysPOYe-LJS4Nz0uzz3L8w';

        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        let logContainer = null;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            console.log(logMessage);
            
            if (logContainer) {
                const logEntry = document.createElement('div');
                logEntry.textContent = logMessage;
                logEntry.style.color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#6c757d';
                logContainer.appendChild(logEntry);
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        function updateStatus(elementId, message, className) {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = message;
                element.className = `status ${className}`;
            }
        }

        async function checkSession() {
            log('🔄 Checking current session...');
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) {
                    log(`❌ Session check error: ${error.message}`, 'error');
                    updateStatus('session-info', `Session Error: ${error.message}`, 'error');
                    return null;
                }

                if (session) {
                    log('✅ Session found', 'success');
                    updateStatus('session-info', 'Session: Active', 'success');
                    updateStatus('user-info', `User: ${session.user.email}`, 'success');
                    updateStatus('auth-status', 'Authenticated', 'success');
                    return session;
                } else {
                    log('❌ No session found');
                    updateStatus('session-info', 'Session: None', 'error');
                    updateStatus('user-info', 'User: Not logged in', 'error');
                    updateStatus('auth-status', 'Not authenticated', 'error');
                    return null;
                }
            } catch (error) {
                log(`❌ Session check failed: ${error.message}`, 'error');
                updateStatus('auth-status', `Error: ${error.message}`, 'error');
                return null;
            }
        }

        async function testLogin() {
            log('🔄 Testing login with test credentials...');
            updateStatus('auth-status', 'Logging in...', 'loading');
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: 'test@subhub.com',
                    password: 'test123456'
                });

                if (error) {
                    log(`❌ Login error: ${error.message}`, 'error');
                    updateStatus('auth-status', `Login Error: ${error.message}`, 'error');
                    return;
                }

                if (data.user) {
                    log('✅ Login successful', 'success');
                    updateStatus('auth-status', 'Login successful', 'success');
                    await checkSession();
                } else {
                    log('❌ Login failed: No user returned');
                    updateStatus('auth-status', 'Login failed: No user', 'error');
                }
            } catch (error) {
                log(`❌ Login failed: ${error.message}`, 'error');
                updateStatus('auth-status', `Login Error: ${error.message}`, 'error');
            }
        }

        async function testLogout() {
            log('🔄 Testing logout...');
            try {
                const { error } = await supabase.auth.signOut();
                
                if (error) {
                    log(`❌ Logout error: ${error.message}`, 'error');
                    updateStatus('auth-status', `Logout Error: ${error.message}`, 'error');
                } else {
                    log('✅ Logout successful', 'success');
                    updateStatus('auth-status', 'Logged out', 'info');
                    updateStatus('session-info', 'Session: None', 'info');
                    updateStatus('user-info', 'User: Not logged in', 'info');
                }
            } catch (error) {
                log(`❌ Logout failed: ${error.message}`, 'error');
                updateStatus('auth-status', `Logout Error: ${error.message}`, 'error');
            }
        }

        function clearLogs() {
            if (logContainer) {
                logContainer.innerHTML = '';
            }
        }

        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', async () => {
            logContainer = document.getElementById('logs');
            log('🚀 SubHub Auth Test initialized');
            
            // Set up auth state change listener
            supabase.auth.onAuthStateChange((event, session) => {
                log(`🔄 Auth state change: ${event}`);
                if (session) {
                    log(`✅ Session active for: ${session.user.email}`, 'success');
                } else {
                    log('❌ No session');
                }
            });

            // Check initial session
            await checkSession();
        });

        // Make functions global for button onclick
        window.testLogin = testLogin;
        window.testLogout = testLogout;
        window.checkSession = checkSession;
        window.clearLogs = clearLogs;
    </script>
</body>
</html>
