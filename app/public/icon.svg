<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#1e40af"/>
  
  <!-- SubHub Logo -->
  <g transform="translate(128, 128)">
    <!-- Main circle -->
    <circle cx="128" cy="128" r="96" fill="#ffffff" opacity="0.1"/>
    
    <!-- Hub center -->
    <circle cx="128" cy="128" r="24" fill="#ffffff"/>
    
    <!-- Subscription connections -->
    <g stroke="#ffffff" stroke-width="8" stroke-linecap="round">
      <!-- Top -->
      <line x1="128" y1="32" x2="128" y2="80"/>
      <circle cx="128" cy="24" r="8" fill="#ffffff"/>
      
      <!-- Top Right -->
      <line x1="196" y1="60" x2="160" y2="96"/>
      <circle cx="204" cy="52" r="8" fill="#ffffff"/>
      
      <!-- Right -->
      <line x1="224" y1="128" x2="176" y2="128"/>
      <circle cx="232" cy="128" r="8" fill="#ffffff"/>
      
      <!-- Bottom Right -->
      <line x1="196" y1="196" x2="160" y2="160"/>
      <circle cx="204" cy="204" r="8" fill="#ffffff"/>
      
      <!-- Bottom -->
      <line x1="128" y1="224" x2="128" y2="176"/>
      <circle cx="128" cy="232" r="8" fill="#ffffff"/>
      
      <!-- Bottom Left -->
      <line x1="60" y1="196" x2="96" y2="160"/>
      <circle cx="52" cy="204" r="8" fill="#ffffff"/>
      
      <!-- Left -->
      <line x1="32" y1="128" x2="80" y2="128"/>
      <circle cx="24" cy="128" r="8" fill="#ffffff"/>
      
      <!-- Top Left -->
      <line x1="60" y1="60" x2="96" y2="96"/>
      <circle cx="52" cy="52" r="8" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- SubHub text -->
  <text x="256" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="bold">SubHub</text>
</svg>
