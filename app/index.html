<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icon-192x192.svg" />
    <link rel="icon" type="image/svg+xml" sizes="512x512" href="/icon.svg" />

    <!-- Viewport and mobile optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e40af" />
    <meta name="background-color" content="#0f172a" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SubHub" />

    <!-- Android PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SubHub" />

    <!-- Description for PWA -->
    <meta name="description" content="Manage your subscriptions with ease. Track costs, set budgets, and get insights." />

    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <title>SubHub - Subscription Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
